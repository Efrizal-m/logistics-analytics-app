# Backend stack for the VPS. TLS and routing are handled by the reverse proxy
# already running on the external `proxy-net` network, so this compose file
# publishes nothing to the internet itself.
#
#   docker network create proxy-net   # only if it does not exist yet
#   cp .env.example .env && edit it
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: logistics-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: reachable for `python -m app.seed` from the host,
    # never from the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  # One-shot: loads the CSV and creates the read-only role the API logs in as.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-seed
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: ["python", "-m", "app.seed"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-api
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Read by nginx-proxy / acme-companion on proxy-net: they watch for
      # these two on any container and auto-generate the vhost + TLS cert,
      # replacing the manual "point the reverse proxy at logistics-api:8000"
      # step below. Only takes effect if that's what's actually running on
      # the host - a different reverse proxy ignores them.
      VIRTUAL_HOST: logistics-api.efrizal.my.id
      LETSENCRYPT_HOST: logistics-api.efrizal.my.id
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    networks:
      # proxy-net is where the existing reverse proxy finds this container by
      # name on port 8000; internal is where it reaches Postgres.
      - proxy-net
      - internal
    mem_limit: 1g

volumes:
  pgdata:

networks:
  internal:
  proxy-net:
    external: true
